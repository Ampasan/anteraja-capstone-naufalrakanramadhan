<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Anteraja – Shipment Tracking Map</title>
  <link rel="stylesheet" href="css/main.css" />
</head>
<body>

<div class="app">

  <!-- Topbar -->
  <header class="topbar">
    <div class="logo" aria-hidden="true">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
        <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5S10.62 6.5 12 6.5s2.5 1.12 2.5 2.5S13.38 11.5 12 11.5z" fill="#fff"/>
      </svg>
    </div>
    <div>
      <div class="topbar-name">Anteraja</div>
      <div class="topbar-sub">Hub Halim, Jakarta Timur</div>
    </div>
    <div class="divider" aria-hidden="true"></div>
    <span class="topbar-title">Shipment Tracking Map</span>
    <div class="topbar-right" id="topbar-date"></div>
  </header>

  <!-- Sidebar -->
  <aside class="sidebar" aria-label="Daftar Shipment">
    <div class="sidebar-header">
      <div class="sidebar-title">Daftar Shipment</div>
      <div class="sidebar-count" id="sidebar-count">Memuat...</div>
    </div>

    <!-- Quick status summary -->
    <div class="stats-row" id="stats-row"></div>

    <!-- List -->
    <div class="shipment-list" id="shipment-list" role="list"></div>
  </aside>

  <!-- Map -->
  <div class="map-wrap">
    <div id="map" role="region" aria-label="Peta lokasi shipment"></div>

    <div id="geocode-toast" role="status" aria-live="polite">
      <div class="toast-type" id="toast-type">Geocoding</div>
      <div id="toast-msg"></div>
    </div>
  </div>

</div>


<script type="module" src="js/main.js"></script>


<script
  src="https://maps.googleapis.com/maps/api/js?key=AIzaSyBU1_9v_6_0MGoVxndnsgW9NuzsGMVHHeY&callback=initMap"
  defer
></script>

</body>
</html>
