<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — Anteraja Dispatch Ops Control Tower</title>
  <link rel="stylesheet" href="css/global.css" />
  <link rel="stylesheet" href="css/pages/login.css" />
</head>
<body>
  <a href="#main-content" class="skip-link">Lewati ke konten utama</a>

  <main id="main-content" class="login-page">
    <div class="login-wrapper">

      <!-- Brand Header -->
      <header class="login-brand" aria-label="Identitas merek">
        <div class="login-brand__logo" aria-hidden="true">
          <img src="assets/anteraja_logo.png" alt="" width="40" height="40" />
        </div>
        <h1 class="login-brand__name">Anteraja</h1>
        <p class="login-brand__product">Dispatch Ops Control Tower</p>
        <p class="login-brand__tagline">Masuk ke sistem pemantauan dan operasional kurir SATRIA</p>
      </header>

      <!-- Login Card -->
      <div class="login-card surface-card" role="region" aria-label="Form masuk">
        <form id="loginForm" class="login-form" novalidate>

          <!-- Stasiun Layanan / Hub -->
          <div class="form-field">
            <label class="form-field__label" for="hubSelect">
              Stasiun Layanan / Hub
            </label>
            <div class="form-field__input-wrap form-field__input-wrap--select">
              <span class="form-field__icon" aria-hidden="true">
                <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <path d="M8 1.5C5.51 1.5 3.5 3.51 3.5 6c0 3.75 4.5 8.5 4.5 8.5s4.5-4.75 4.5-8.5c0-2.49-2.01-4.5-4.5-4.5zm0 6.1a1.6 1.6 0 1 1 0-3.2 1.6 1.6 0 0 1 0 3.2z" fill="#94A3B8"/>
                </svg>
              </span>
              <select id="hubSelect" name="hub" class="form-field__select" required aria-required="true">
                <option value="hub-tebet">Hub Tebet – Jakarta Selatan</option>
                <option value="hub-kemayoran">Hub Kemayoran – Jakarta Pusat</option>
                <option value="hub-bekasi">Hub Bekasi – Bekasi Barat</option>
                <option value="hub-tangerang">Hub Tangerang – Tangerang Kota</option>
                <option value="hub-depok">Hub Depok – Depok</option>
              </select>
              <span class="form-field__chevron" aria-hidden="true">
                <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <path d="M4 6l4 4 4-4" stroke="#64748B" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
              </span>
            </div>
          </div>

          <!-- NIK atau Email Dinas -->
          <div class="form-field">
            <label class="form-field__label" for="nikEmail">
              NIK atau Email Dinas
            </label>
            <div class="form-field__input-wrap">
              <span class="form-field__icon" aria-hidden="true">
                <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <path d="M2.5 4A1.5 1.5 0 0 1 4 2.5h8A1.5 1.5 0 0 1 13.5 4v8a1.5 1.5 0 0 1-1.5 1.5H4A1.5 1.5 0 0 1 2.5 12V4z" stroke="#94A3B8" stroke-width="1.2"/>
                  <path d="M2.5 6.5h11" stroke="#94A3B8" stroke-width="1.2"/>
                  <path d="M5.5 6.5v7" stroke="#94A3B8" stroke-width="1.2"/>
                </svg>
              </span>
              <input
                type="text"
                id="nikEmail"
                name="nikEmail"
                class="form-field__input"
                placeholder="siti.admin@anteraja.id"
                autocomplete="username"
                required
                aria-required="true"
                aria-describedby="nikEmail-error"
              />
            </div>
            <span id="nikEmail-error" class="form-field__error" role="alert" aria-live="polite"></span>
          </div>

          <!-- Kata Sandi -->
          <div class="form-field">
            <div class="form-field__label-row">
              <label class="form-field__label" for="password">
                Kata Sandi
              </label>
              <button type="button" class="link-forgot" id="forgotPasswordBtn" aria-label="Lupa kata sandi — buka halaman reset">
                Lupa kata sandi?
              </button>
            </div>
            <div class="form-field__input-wrap">
              <span class="form-field__icon" aria-hidden="true">
                <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <rect x="2.5" y="7" width="11" height="7.5" rx="1.5" stroke="#94A3B8" stroke-width="1.2"/>
                  <path d="M5 7V5a3 3 0 0 1 6 0v2" stroke="#94A3B8" stroke-width="1.2" stroke-linecap="round"/>
                  <circle cx="8" cy="10.5" r="1" fill="#94A3B8"/>
                </svg>
              </span>
              <input
                type="password"
                id="password"
                name="password"
                class="form-field__input"
                placeholder="Anteraja2026!"
                autocomplete="current-password"
                required
                aria-required="true"
                aria-describedby="password-error"
              />
              <button
                type="button"
                class="form-field__toggle-password"
                id="togglePassword"
                aria-label="Tampilkan kata sandi"
                aria-pressed="false"
              >
                <svg class="icon-eye-show" width="18" height="18" viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                  <path d="M1.5 9S4 3.75 9 3.75 16.5 9 16.5 9 14 14.25 9 14.25 1.5 9 1.5 9z" stroke="#64748B" stroke-width="1.3" stroke-linejoin="round"/>
                  <circle cx="9" cy="9" r="2.25" stroke="#64748B" stroke-width="1.3"/>
                </svg>
                <svg class="icon-eye-hide" width="18" height="18" viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" style="display:none;">
                  <path d="M2.25 2.25l13.5 13.5M7.44 7.44A2.25 2.25 0 0 0 9 11.25a2.25 2.25 0 0 0 1.56-3.81M5.1 5.1C3.3 6.24 1.5 9 1.5 9s2.5 5.25 7.5 5.25a7.13 7.13 0 0 0 3.9-1.1M12.9 12.9C14.7 11.76 16.5 9 16.5 9S14 3.75 9 3.75c-1.36 0-2.62.34-3.75.9" stroke="#64748B" stroke-width="1.3" stroke-linecap="round"/>
                </svg>
              </button>
            </div>
            <span id="password-error" class="form-field__error" role="alert" aria-live="polite"></span>
          </div>

          <!-- Remember Me -->
          <div class="form-check">
            <label class="form-check__label" for="rememberMe">
              <input
                type="checkbox"
                id="rememberMe"
                name="rememberMe"
                class="form-check__input"
              />
              <span class="form-check__box" aria-hidden="true"></span>
              <span class="form-check__text">Ingat saya di perangkat ini</span>
            </label>
          </div>

          <!-- Error Alert -->
          <div id="loginError" class="login-alert login-alert--error" role="alert" aria-live="assertive" hidden>
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
              <circle cx="8" cy="8" r="6.5" stroke="#DC2626" stroke-width="1.3"/>
              <path d="M8 5v3.5M8 10.5v.5" stroke="#DC2626" stroke-width="1.4" stroke-linecap="round"/>
            </svg>
            <span id="loginErrorMsg">NIK/Email atau Kata Sandi tidak valid.</span>
          </div>

          <!-- Submit Button -->
          <button type="submit" class="btn-login" id="loginBtn" aria-describedby="loginError">
            <span class="btn-login__label">Masuk ke Panel Dispatch</span>
            <svg class="btn-login__arrow" width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true">
              <path d="M3.75 9h10.5M9.75 5.25L13.5 9l-3.75 3.75" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <span class="btn-login__spinner" aria-hidden="true" hidden></span>
          </button>

        </form>
      </div>

      <!-- Footer -->
      <footer class="login-footer">
        <p>PT Tri Adi Bersama (Anteraja) &copy; 2026</p>
      </footer>

    </div>
  </main>

  <script src="javascript/login.js"></script>

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Organization",
    "name": "Anteraja",
    "legalName": "PT Tri Adi Bersama",
    "url": "https://anteraja.id",
    "logo": "https://anteraja.id/logo.png",
    "description": "Perusahaan jasa pengiriman dan logistik yang beroperasi di Indonesia, menyediakan layanan Same Day, Instant, Cargo, Frozen, Regular, dan Next Day.",
    "sameAs": [
      "https://www.instagram.com/anteraja.id",
      "https://www.facebook.com/anteraja.id"
    ]
  }
  </script>
</body>
</html>
